<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltimateType</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        shake: 'shake 0.3s infinite',
                    },
                    keyframes: {
                        shake: {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '10%, 30%, 50%, 70%, 90%': { transform: 'translateX(-5px) translateY(2px) rotate(-1deg)' },
                            '20%, 40%, 60%, 80%': { transform: 'translateX(5px) translateY(-2px) rotate(1deg)' }
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* Theme Utility Classes linking to CSS Variables */
        .theme-bg { background-color: var(--bg); }
        .theme-text { color: var(--text); }
        .theme-text-muted { color: var(--text-muted); }
        .theme-text-bright { color: var(--text-bright); }
        .theme-accent { color: var(--accent); }
        .theme-accent-bg { background-color: var(--accent-bg); }
        .theme-error { color: var(--error); }
        .theme-error-bg { background-color: var(--error-bg); }
        .theme-error-border { border-color: var(--error-border); }
        .theme-panel-bg { background: var(--panel-bg); }
        .theme-border { border-color: var(--border); }
        
        .shadow-panel { box-shadow: var(--panel-shadow, 0 1px 2px 0 rgb(0 0 0 / 0.05)); }
        
        @keyframes customPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .animate-custom-pulse { animation: customPulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        
        /* Transition Overrides */
        * { transition-property: color, background-color, border-color, text-decoration-color, fill, stroke; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 300ms; }
    </style>
</head>
<body class="min-h-screen theme-bg theme-text font-sans flex flex-col items-center p-6 sm:p-12 overflow-hidden transition-all duration-500">

    <header class="w-full max-w-6xl flex flex-col sm:flex-row gap-4 items-center justify-between mb-8 z-10">
        <div id="logo-btn" class="flex items-center gap-3 font-bold text-2xl tracking-tighter cursor-pointer theme-accent hover:opacity-80 transition-all duration-300">
            <i data-lucide="keyboard" class="w-8 h-8 stroke-[2.5]"></i>
            <span>UltimateType</span>
        </div>

        <div id="top-controls" class="flex flex-wrap justify-center items-center gap-4 transition-opacity duration-300">
            <div class="flex items-center gap-2 theme-panel-bg shadow-panel px-3 py-1.5 rounded-lg border theme-border">
                <span id="retro-label-off" class="text-xs font-bold uppercase tracking-wider theme-text-bright">Normal</span>
                <div id="retro-toggle" class="w-10 h-5 flex items-center rounded-full p-1 cursor-pointer bg-zinc-600 transition-colors">
                    <div id="retro-toggle-knob" class="bg-white w-3 h-3 rounded-full shadow-md transform transition-transform duration-300"></div>
                </div>
                <span id="retro-label-on" class="text-xs font-bold uppercase tracking-wider theme-text-muted">Retro</span>
            </div>

            <div id="modes-container" class="flex theme-panel-bg shadow-panel rounded-lg p-1.5"></div>

            <div id="times-container" class="flex theme-panel-bg shadow-panel rounded-lg p-1.5"></div>

            <div class="flex gap-2 theme-panel-bg shadow-panel rounded-lg p-1.5">
                <button id="btn-sound" class="p-1.5 rounded-md hover:bg-black/10 opacity-70 hover:opacity-100" title="Toggle Sound">
                    <i id="icon-sound" data-lucide="volume-x" class="w-[18px] h-[18px]"></i>
                </button>
                <button id="btn-theme" class="p-1.5 rounded-md hover:bg-black/10 opacity-70 hover:opacity-100" title="Toggle Theme">
                    <i data-lucide="settings" class="w-[18px] h-[18px]"></i>
                </button>
                <button id="btn-achievements" class="p-1.5 rounded-md hover:bg-black/10 opacity-70 hover:opacity-100" title="Achievements">
                    <i data-lucide="award" class="w-[18px] h-[18px]"></i>
                </button>
            </div>
        </div>
    </header>

    <main id="main-content" class="w-full flex-1 flex flex-col relative justify-center max-w-5xl transition-transform duration-700">
        
        <div id="view-test" class="w-full mx-auto flex flex-col items-center">
            <div id="live-stats" class="w-full max-w-4xl flex justify-between items-center mb-6 transition-opacity duration-300 opacity-0">
                <div class="flex items-center gap-6 theme-accent">
                    <div id="time-left" class="text-3xl font-mono font-medium w-16">30s</div>
                    <div class="relative flex flex-col items-center justify-end h-16 w-32 overflow-hidden">
                        <svg class="absolute top-0 w-full h-full" viewBox="0 0 100 50">
                            <path d="M 15 45 A 35 35 0 0 1 85 45" fill="none" stroke="var(--text)" stroke-width="8" class="opacity-20" stroke-linecap="round" />
                            <path id="speed-path" d="M 15 45 A 35 35 0 0 1 85 45" fill="none" stroke="rgb(var(--accent-raw))" stroke-width="8" stroke-dasharray="109.95" stroke-dashoffset="109.95" class="transition-all duration-300 ease-out" stroke-linecap="round" />
                        </svg>
                        <div class="absolute bottom-0 flex flex-col items-center translate-y-1">
                            <span id="speed-text" class="text-xl font-bold font-mono theme-accent">0</span>
                        </div>
                    </div>
                </div>
                <div id="combo-display" class="flex items-center gap-2 text-2xl font-bold font-mono transition-all duration-300 theme-text-muted">
                    <i id="combo-icon" data-lucide="flame" class="w-6 h-6 transition-all duration-300"></i>
                    <span id="combo-text">0</span>
                </div>
            </div>

            <div id="typing-container" class="relative group cursor-text w-full max-w-4xl" onclick="document.getElementById('type-input').focus()">
                <div id="focus-overlay" class="absolute inset-0 z-20 backdrop-blur-[4px] bg-black/10 flex flex-col items-center justify-center rounded-xl transition-all duration-300">
                    <span class="text-lg font-medium flex items-center gap-3 px-6 py-3 rounded-full shadow-lg theme-bg theme-text-bright">
                        <i data-lucide="alert-circle" class="w-5 h-5 theme-accent"></i> Click to focus
                    </span>
                </div>
                <input id="type-input" type="text" class="absolute opacity-0 -left-[9999px]" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
                
                <div class="h-[144px] overflow-hidden relative w-full">
                    <div id="words-wrapper" class="flex flex-wrap gap-x-4 gap-y-2 leading-[48px] text-[32px] font-mono select-none transition-transform duration-200 ease-out absolute w-full">
                        </div>
                </div>
            </div>

            <div id="capslock-warning" class="mt-8 flex justify-center hidden animate-in slide-in-from-top-2">
                <div class="px-4 py-2 rounded-lg flex items-center gap-2 text-sm font-medium border theme-error theme-error-bg theme-error-border">
                    <i data-lucide="alert-triangle" class="w-4 h-4"></i> Caps Lock is on!
                </div>
            </div>
        </div>

        <div id="view-results" class="hidden flex-col items-center justify-center w-full animate-in fade-in duration-700"></div>

        <div id="view-achievements" class="hidden w-full mb-auto mt-4 animate-in fade-in duration-500"></div>

        <div id="bottom-controls" class="mt-auto pt-12 flex flex-col items-center justify-center gap-3 theme-text-muted">
            <button onclick="initTest(state.duration, state.mode)" class="p-4 rounded-full transition-all duration-200 group hover:theme-text-bright hover:bg-black/10" title="Restart Test">
                <i id="restart-icon" data-lucide="rotate-ccw" class="w-7 h-7 group-hover:-rotate-90 transition-transform duration-300"></i>
            </button>
            <span class="text-xs font-medium uppercase tracking-widest opacity-50 px-3 py-1 rounded-md theme-panel-bg border theme-border">tab / esc to restart</span>
        </div>

        <div id="mascot-wrapper" class="fixed bottom-6 right-6 flex items-end gap-3 transition-all duration-500 z-50 opacity-30 hover:opacity-100">
            <div id="mascot-msg" class="px-4 py-2 rounded-2xl rounded-br-none theme-panel-bg theme-border border shadow-lg text-sm font-bold theme-text-bright animate-bounce">Ready, set, type!</div>
            <div id="mascot-face" class="w-14 h-14 rounded-full theme-panel-bg border-2 theme-border flex items-center justify-center text-3xl shadow-xl select-none cursor-pointer hover:scale-110 active:scale-90 transition-transform bg-opacity-90">👾</div>
        </div>

        <div id="toasts-container" class="fixed top-8 right-8 flex flex-col gap-3 z-50 pointer-events-none"></div>
    </main>

    <script>
        // --- Dictionary & Utilities ---
        const DICTIONARY = ["the", "be", "to", "of", "and", "a", "in", "that", "have", "I", "it", "for", "not", "on", "with", "he", "as", "you", "do", "at", "this", "but", "his", "by", "from", "they", "we", "say", "her", "she", "or", "an", "will", "my", "one", "all", "would", "there", "their", "what", "so", "up", "out", "if", "about", "who", "get", "which", "go", "me", "when", "make", "can", "like", "time", "no", "just", "him", "know", "take", "people", "into", "year", "your", "good", "some", "could", "them", "see", "other", "than", "then", "now", "look", "only", "come", "its", "over", "think", "also", "back", "after", "use", "two", "how", "our", "work", "first", "well", "way", "even", "new", "want", "because", "any", "these", "give", "day", "most", "us", "is", "are", "was", "were", "been", "being", "has", "had", "does", "did", "going", "many", "much", "more", "life", "world", "between", "each", "program", "developer", "experience", "beautiful", "important", "children", "different"];
        const PUNCTUATION = [",", ".", "?", "!", ";", ":", '""'];
        
        const ALL_ACHIEVEMENTS = [
            { id: 'Speed Star 🌟', title: 'Speed Star', icon: '🌟', desc: 'Reach 100 WPM', hidden: false },
            { id: 'Perfect Accuracy 🎯', title: 'Perfect Accuracy', icon: '🎯', desc: 'Finish a test with 100% accuracy', hidden: false },
            { id: 'Combo Master ⚡', title: 'Combo Master', icon: '⚡', desc: 'Reach a 50 perfect word streak', hidden: false },
            { id: 'New High Score! 🏆', title: 'New High Score!', icon: '🏆', desc: 'Beat your personal best', hidden: false },
            { id: 'Marathon Runner 🏃', title: 'Marathon Runner', icon: '🏃', desc: 'Complete a 120-second test', hidden: false },
            { id: 'Punctuation Pedant 📝', title: 'Punctuation Pedant', icon: '📝', desc: 'Complete a punctuation mode test', hidden: false },
            { id: 'Number Cruncher 🔢', title: 'Number Cruncher', icon: '🔢', desc: 'Complete a numbers mode test', hidden: false },
            { id: 'Hardcore 💀', title: 'Hardcore', icon: '💀', desc: 'Complete a hard mode test', hidden: false },
            { id: 'Sonic Speed 🦔', title: 'Sonic Speed', icon: '🦔', desc: 'Reach a blistering 120+ WPM', hidden: true },
            { id: 'Slow & Steady 🐢', title: 'Slow & Steady', icon: '🐢', desc: 'Finish with 100% accuracy but under 20 WPM', hidden: true },
            { id: 'Code Wizard 🧙‍♂️', title: 'Code Wizard', icon: '🧙‍♂️', desc: 'Correctly type "developer"', hidden: true },
            { id: 'Do a barrel roll 🛩️', title: 'Barrel Roll', icon: '🛩️', desc: 'Type "barrel"', hidden: true },
            { id: 'Caffeine Rush ☕', title: 'Caffeine Rush', icon: '☕', desc: 'Type "coffee"', hidden: true },
            { id: 'The Answer 🌌', title: 'The Answer', icon: '🌌', desc: 'Type "42"', hidden: true },
            { id: 'Back to the 80s 📼', title: 'Back to the 80s', icon: '📼', desc: 'Activate Retro mode', hidden: true },
            { id: 'Matrix Hacker 🕶️', title: 'Matrix Hacker', icon: '🕶️', desc: 'Discover the Matrix theme by typing "matrix"', hidden: true },
            { id: 'Backspace Abuser ⌨️', title: 'Backspace Abuser', icon: '⌨️', desc: 'Use backspace over 50 times in one test', hidden: true },
            { id: 'Stop Poking Me 😵', title: 'Stop Poking Me', icon: '😵', desc: 'Annoy the mascot by clicking them repeatedly', hidden: true },
            { id: 'Night Owl 🦉', title: 'Night Owl', icon: '🦉', desc: 'Complete a test between 12 AM and 4 AM', hidden: true }
        ];

        const THEMES = {
            dark: { '--bg': '#1e1e20', '--bg-raw': '#1e1e20', '--text': '#a1a1aa', '--text-muted': '#71717a', '--text-bright': '#e4e4e7', '--accent': '#facc15', '--accent-raw': '250, 204, 21', '--accent-bg': '#facc15', '--error': '#f87171', '--error-bg': 'rgba(127,29,29,0.4)', '--error-border': 'rgba(239,68,68,0.5)', '--panel-bg': 'rgba(24,24,27,0.4)', '--border': 'rgba(39,39,42,0.5)', '--caret-bg': '#facc15', '--caret-shadow': '0 0 8px rgba(250,204,21,0.6)', '--panel-shadow': '0 1px 2px 0 rgb(0 0 0 / 0.05)' },
            light: { '--bg': '#f8fafc', '--bg-raw': '#f8fafc', '--text': '#94a3b8', '--text-muted': '#94a3b8', '--text-bright': '#1e293b', '--accent': '#3b82f6', '--accent-raw': '59, 130, 246', '--accent-bg': '#3b82f6', '--error': '#ef4444', '--error-bg': '#fee2e2', '--error-border': 'rgba(239,68,68,0.5)', '--panel-bg': '#ffffff', '--border': '#e2e8f0', '--caret-bg': '#3b82f6', '--caret-shadow': '0 0 8px rgba(59,130,246,0.4)', '--panel-shadow': '0 1px 2px 0 rgb(0 0 0 / 0.05)' },
            matrix: { '--bg': '#000000', '--bg-raw': '#000000', '--text': '#14532d', '--text-muted': '#14532d', '--text-bright': '#4ade80', '--accent': '#22c55e', '--accent-raw': '34, 197, 94', '--accent-bg': '#22c55e', '--error': '#dc2626', '--error-bg': 'rgba(127,29,29,0.5)', '--error-border': 'rgba(220,38,38,0.5)', '--panel-bg': 'rgba(5,46,22,0.2)', '--border': 'rgba(20,83,45,0.3)', '--caret-bg': '#4ade80', '--caret-shadow': '0 0 8px rgba(74,222,128,0.6)', '--panel-shadow': 'none' },
            arcade: { '--bg': '#1e1b4b', '--bg-raw': '#1e1b4b', '--text': '#e879f9', '--text-muted': '#a21caf', '--text-bright': '#67e8f9', '--accent': '#facc15', '--accent-raw': '250, 204, 21', '--accent-bg': '#facc15', '--error': '#ef4444', '--error-bg': 'rgba(127,29,29,0.6)', '--error-border': 'rgba(239,68,68,0.8)', '--panel-bg': 'rgba(112,26,117,0.2)', '--border': 'rgba(217,70,239,0.3)', '--caret-bg': '#67e8f9', '--caret-shadow': '0 0 12px rgba(103,232,249,0.8)', '--panel-shadow': '0 0 15px rgba(217,70,239,0.2)' },
            retro: { '--bg': '#2a211c', '--bg-raw': '#2a211c', '--text': '#ffb000', '--text-muted': '#8c6200', '--text-bright': '#ffcc4d', '--accent': '#ff5900', '--accent-raw': '255, 89, 0', '--accent-bg': '#ff5900', '--error': '#ef4444', '--error-bg': 'rgba(127,29,29,0.5)', '--error-border': 'rgba(239,68,68,0.5)', '--panel-bg': '#1a1410', '--border': '#4a3410', '--caret-bg': '#ff5900', '--caret-shadow': 'none', '--panel-shadow': 'none' }
        };

        // --- Global State ---
        const state = {
            duration: 30, mode: 'words', themeName: 'dark', soundEnabled: false,
            personalBest: parseInt(localStorage.getItem('ultimate_type_pb')) || 0,
            isRetro: false, currentView: 'test', unlockedAchievements: [],
            words: [], status: 'idle', timeLeft: 30, history: [], currentWord: '', activeWordIndex: 0,
            isFocused: false, capsLock: false, lineOffset: 0, timeline: [], liveWpm: 0, combo: 0, maxCombo: 0,
            backspaceCount: 0, toasts: [], barrelRoll: false, jitter: false, mascotClicks: 0, logoClicks: 0,
            timerInterval: null, audioContextResumed: false
        };

        try {
            // FIX #6: Load saved theme preference
            const savedTheme = localStorage.getItem('ultimate_type_theme');
            if (savedTheme && THEMES[savedTheme]) state.themeName = savedTheme;
            const savedAcc = localStorage.getItem('ultimate_type_achievements');
            if (savedAcc) state.unlockedAchievements = JSON.parse(savedAcc);
        } catch(e){}

        // --- Audio System ---
        const audioCtx = window.AudioContext || window.webkitAudioContext ? new (window.AudioContext || window.webkitAudioContext)() : null;
        
        function resumeAudioContext() {
            if (!audioCtx || state.audioContextResumed) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().then(() => {
                    state.audioContextResumed = true;
                }).catch(err => console.log('Audio context resume failed:', err));
            } else {
                state.audioContextResumed = true;
            }
        }

        function playSound(type) {
            if (!audioCtx || !state.soundEnabled) return;
            resumeAudioContext();
            try {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                if (type === 'type') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.05);
                    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'mascot') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                }
            } catch(e) {
                console.log('Sound playback error:', e);
            }
        }

        // --- Word Generation & Metrics ---
        function generateWords(count, mode) {
            return Array.from({ length: count }, () => {
                let word = "";
                if (mode === 'numbers') {
                    word = Math.floor(Math.random() * 10000).toString();
                } else if (mode === 'hard') {
                    const longWords = DICTIONARY.filter(w => w.length >= 6);
                    word = longWords[Math.floor(Math.random() * longWords.length)];
                } else {
                    word = DICTIONARY[Math.floor(Math.random() * DICTIONARY.length)];
                    if (mode === 'punctuation') {
                        if (Math.random() > 0.7) word = word.charAt(0).toUpperCase() + word.slice(1);
                        if (Math.random() > 0.7) word += PUNCTUATION[Math.floor(Math.random() * PUNCTUATION.length)];
                        if (Math.random() > 0.95) word = `"${word}"`;
                    }
                }
                return word;
            });
        }

        function computeMetrics(hist, curr, targetWords, totalTime, timeRemaining) {
            let correctChars = 0, incorrectChars = 0, totalChars = 0;
            const allTyped = [...hist, curr];
            allTyped.forEach((typed, i) => {
                const target = targetWords[i];
                if (!target) return;
                const maxLen = Math.max(target.length, typed.length);
                for (let j = 0; j < maxLen; j++) {
                    totalChars++;
                    if (j < target.length && j < typed.length && target[j] === typed[j]) {
                        correctChars++;
                    } else { incorrectChars++; }
                }
                if (typed === target) { correctChars++; totalChars++; }
            });
            const elapsedMins = (totalTime - timeRemaining) / 60;
            const wpm = Math.round((correctChars / 5) / (elapsedMins || (1/60)));
            const accuracy = totalChars === 0 ? 0 : Math.round((correctChars / totalChars) * 100);
            return { wpm, accuracy, correctChars, incorrectChars, totalChars };
        }

        // --- Core UI Management ---
        function applyTheme() {
            const activeThemeName = state.isRetro ? 'retro' : state.themeName;
            const t = THEMES[activeThemeName];
            for (let k in t) document.documentElement.style.setProperty(k, t[k]);
            
            // UI Toggle States
            document.getElementById('retro-toggle-knob').style.transform = state.isRetro ? 'translateX(20px)' : 'translateX(0)';
            document.getElementById('retro-toggle').style.backgroundColor = state.isRetro ? 'var(--accent-bg)' : '#52525b';
            document.getElementById('retro-label-off').className = `text-xs font-bold uppercase tracking-wider ${state.isRetro ? 'theme-text-muted' : 'theme-text-bright'}`;
            document.getElementById('retro-label-on').className = `text-xs font-bold uppercase tracking-wider ${state.isRetro ? 'theme-text-bright' : 'theme-text-muted'}`;
            document.getElementById('btn-theme').querySelector('i').style.opacity = state.isRetro ? '0.3' : '1';
            document.getElementById('btn-theme').disabled = state.isRetro;

            renderHeaderButtons();
        }

        function setView(view) {
            state.currentView = view;
            document.getElementById('view-test').style.display = (view === 'test' && state.status !== 'finished') ? 'flex' : 'none';
            document.getElementById('view-achievements').style.display = view === 'achievements' ? 'block' : 'none';
            document.getElementById('view-results').style.display = (view === 'test' && state.status === 'finished') ? 'flex' : 'none';
            document.getElementById('top-controls').style.opacity = (state.status === 'running') ? '0' : '1';
            document.getElementById('top-controls').style.pointerEvents = (state.status === 'running') ? 'none' : 'auto';
            
            document.getElementById('btn-achievements').classList.toggle('theme-accent', view === 'achievements');
            if (view === 'achievements') renderAchievements();
            else if (view === 'test' && state.status === 'idle') setTimeout(() => document.getElementById('type-input').focus(), 50);
        }

        function unlockAchievement(title) {
            if (!state.unlockedAchievements.includes(title)) {
                state.unlockedAchievements.push(title);
                localStorage.setItem('ultimate_type_achievements', JSON.stringify(state.unlockedAchievements));
                showToast(title);
            }
        }

        function showToast(title) {
            const id = Date.now();
            const container = document.getElementById('toasts-container');
            const toast = document.createElement('div');
            toast.className = `animate-in slide-in-from-right-8 fade-in duration-300 flex items-center gap-3 px-5 py-3 rounded-xl shadow-2xl font-bold border theme-panel-bg theme-border theme-text-bright`;
            toast.innerHTML = `<i data-lucide="award" class="w-6 h-6 theme-accent"></i><div><div class="text-[10px] uppercase tracking-wider opacity-70">Achievement Unlocked</div><div class="text-sm">${title}</div></div>`;
            container.appendChild(toast);
            lucide.createIcons({root: toast});
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(()=>toast.remove(), 300); }, 4000);
        }

        // --- Initialization & Game Loop ---
        function initTest(time = state.duration, testMode = state.mode) {
            clearInterval(state.timerInterval);
            state.duration = time; state.mode = testMode; state.timeLeft = time;
            state.words = generateWords(500, testMode);
            state.status = 'idle'; state.history = []; state.currentWord = '';
            state.activeWordIndex = 0; state.lineOffset = 0; state.timeline = [];
            state.liveWpm = 0; state.combo = 0; state.maxCombo = 0; state.backspaceCount = 0;
            state.barrelRoll = false; state.jitter = false; state.mascotClicks = 0;
            
            document.getElementById('main-content').className = `w-full flex-1 flex flex-col relative justify-center max-w-5xl transition-transform duration-700`;
            document.getElementById('type-input').value = '';
            
            setView('test');
            renderHeaderButtons();
            renderWordsFull();
            updateFocusUI();
            updateLiveStatsUI();
            updateMascot();
            
            document.getElementById('bottom-controls').style.display = 'flex';
            document.getElementById('words-wrapper').style.transform = `translate3d(0, 0, 0)`;
            
            if(state.currentView === 'test') document.getElementById('type-input').focus();
        }

        function startTimer() {
            state.timerInterval = setInterval(() => {
                state.timeLeft--;
                const stats = computeMetrics(state.history, state.currentWord, state.words, state.duration, state.timeLeft);
                state.timeline.push({ time: state.duration - state.timeLeft, wpm: stats.wpm });
                state.liveWpm = stats.wpm;
                
                updateLiveStatsUI();
                
                if (state.timeLeft <= 0) {
                    clearInterval(state.timerInterval);
                    finishTest(stats);
                }
            }, 1000);
        }

        function finishTest(stats) {
            state.status = 'finished';
            document.getElementById('type-input').blur();
            
            if (stats.wpm > state.personalBest) {
                state.personalBest = stats.wpm;
                localStorage.setItem('ultimate_type_pb', stats.wpm.toString());
                unlockAchievement('New High Score! 🏆');
            }
            
            // Check Achievements
            if (stats.wpm >= 100) unlockAchievement('Speed Star 🌟');
            if (stats.wpm >= 120) unlockAchievement('Sonic Speed 🦔');
            if (stats.accuracy === 100 && stats.totalChars > 0) unlockAchievement('Perfect Accuracy 🎯');
            if (stats.accuracy === 100 && stats.wpm < 20 && stats.totalChars > 0) unlockAchievement('Slow & Steady 🐢');
            if (state.maxCombo >= 50) unlockAchievement('Combo Master ⚡');
            if (state.duration === 120) unlockAchievement('Marathon Runner 🏃');
            if (state.mode === 'punctuation') unlockAchievement('Punctuation Pedant 📝');
            if (state.mode === 'numbers') unlockAchievement('Number Cruncher 🔢');
            if (state.mode === 'hard') unlockAchievement('Hardcore 💀');
            const hour = new Date().getHours();
            if (hour >= 0 && hour < 4) unlockAchievement('Night Owl 🦉');

            renderResultsView(stats);
            setView('test');
            updateMascot();
        }

        // --- Typing Logic ---
        function getWordHTML(word, wIdx) {
            const isActive = wIdx === state.activeWordIndex;
            const isTyped = wIdx < state.activeWordIndex;
            const typedData = isActive ? state.currentWord : (isTyped ? state.history[wIdx] : '');
            const isPerfect = isTyped && word === typedData;
            const isErrorWord = isTyped && !isPerfect;

            const targetChars = word.split('');
            const typedChars = typedData.split('');
            const maxLen = Math.max(targetChars.length, typedChars.length);

            let html = `<div id="word-${wIdx}" class="flex tracking-wide transition-colors duration-200 ${isErrorWord ? 'border-b-2 theme-error-border -mb-[2px]' : ''} ${isPerfect ? 'theme-text-bright drop-shadow-sm' : ''}">`;

            for (let cIdx = 0; cIdx < maxLen; cIdx++) {
                const targetChar = targetChars[cIdx];
                const typedChar = typedChars[cIdx];
                let colorClass = 'theme-text-muted';

                if (typedChar) {
                    if (targetChar === typedChar) colorClass = 'theme-text-bright';
                    else colorClass = 'theme-error theme-error-bg rounded-sm';
                }
                const isCaretHere = isActive && state.isFocused && cIdx === typedChars.length;
                const caretHtml = isCaretHere ? `<span class="absolute -left-[2px] top-[10%] bottom-[10%] w-[3px] animate-custom-pulse rounded-full z-10 bg-[var(--caret-bg)]" style="box-shadow: var(--caret-shadow)"></span>` : '';

                html += `<span class="relative">${caretHtml}<span class="${colorClass}">${targetChar || typedChar}</span></span>`;
            }
            
            // FIX #1: Correct caret positioning after word completion
            if (isActive && state.isFocused && typedChars.length === maxLen && typedChars.length > 0) {
                html += `<span class="relative"><span class="absolute -left-[2px] top-[10%] bottom-[10%] w-[3px] animate-custom-pulse rounded-full z-10 bg-[var(--caret-bg)]" style="box-shadow: var(--caret-shadow)"></span></span>`;
            }
            html += `</div>`;
            return html;
        }

        function renderWordsFull() {
            const wrapper = document.getElementById('words-wrapper');
            wrapper.innerHTML = state.words.map((w, i) => getWordHTML(w, i)).join('');
        }

        function updateSingleWord(index) {
            const el = document.getElementById(`word-${index}`);
            if (el) el.outerHTML = getWordHTML(state.words[index], index);
        }

        function handleInput(e) {
            if (state.status === 'finished') return;
            if (state.status === 'idle') {
                state.status = 'running';
                state.timeline = [{ time: 0, wpm: 0 }];
                resumeAudioContext();
                startTimer();
                updateFocusUI();
            }

            const val = e.target.value;
            const targetWord = state.words[state.activeWordIndex];

            if (state.soundEnabled) {
                const isError = !targetWord.startsWith(val.trim());
                playSound(isError ? 'error' : 'type');
            }

            if (val.endsWith(' ')) {
                if (state.currentWord.trim() === '' && val.trim() === '') {
                    e.target.value = ''; return;
                }
                const normalized = state.currentWord.trim().toLowerCase();
                
                // Easter Eggs
                if (normalized === 'barrel') {
                    state.barrelRoll = true;
                    document.getElementById('main-content').classList.add('rotate-[360deg]', 'scale-50');
                    setTimeout(() => document.getElementById('main-content').classList.remove('rotate-[360deg]', 'scale-50'), 800);
                    unlockAchievement('Do a barrel roll 🛩️');
                }
                if (normalized === 'developer' && targetWord === 'developer') unlockAchievement('Code Wizard 🧙‍♂️');
                if (normalized === 'matrix') {
                    state.isRetro = false; state.themeName = 'matrix'; applyTheme();
                    unlockAchievement('Matrix Hacker 🕶️');
                }
                if (normalized === 'coffee') {
                    state.jitter = true;
                    document.getElementById('main-content').classList.add('animate-shake', 'text-yellow-100');
                    setTimeout(() => document.getElementById('main-content').classList.remove('animate-shake', 'text-yellow-100'), 2000);
                    unlockAchievement('Caffeine Rush ☕');
                }
                if (normalized === '42') unlockAchievement('The Answer 🌌');

                if (state.currentWord === targetWord) {
                    state.combo++;
                    state.maxCombo = Math.max(state.maxCombo, state.combo);
                } else { state.combo = 0; }

                state.history.push(state.currentWord);
                const oldIdx = state.activeWordIndex;
                
                // FIX #5: Add boundary check for word index
                if (state.activeWordIndex < state.words.length - 1) {
                    state.activeWordIndex++;
                }
                state.currentWord = '';
                e.target.value = '';
                
                updateSingleWord(oldIdx);
                updateSingleWord(state.activeWordIndex);
                updateScroll();
            } else {
                state.currentWord = val;
                if (!targetWord.startsWith(val)) state.combo = 0;
                updateSingleWord(state.activeWordIndex);
            }
            updateLiveStatsUI();
            updateMascot();
        }

        function handleKeyDown(e) {
            if (e.key === 'Tab' || e.key === 'Escape') {
                e.preventDefault(); initTest(); return;
            }
            if (state.status === 'finished') return;

            if (e.key === 'Backspace') {
                state.backspaceCount++;
                if (state.backspaceCount === 50) unlockAchievement('Backspace Abuser ⌨️');
                if (state.currentWord === '' && state.activeWordIndex > 0) {
                    e.preventDefault();
                    const prevWord = state.history.pop();
                    const oldIdx = state.activeWordIndex;
                    state.activeWordIndex--;
                    state.currentWord = prevWord;
                    
                    // FIX #4: Recalculate combo when reverting word
                    const targetWord = state.words[state.activeWordIndex];
                    if (prevWord !== targetWord) {
                        state.combo = 0;
                    }
                    
                    document.getElementById('type-input').value = prevWord;
                    updateSingleWord(oldIdx);
                    updateSingleWord(state.activeWordIndex);
                    updateScroll();
                    updateLiveStatsUI();
                }
            }
        }

        function updateScroll() {
            const el = document.getElementById(`word-${state.activeWordIndex}`);
            if (el && state.status !== 'finished') {
                const offset = el.offsetTop;
                state.lineOffset = offset > 48 ? offset - 48 : 0;
                // FIX #3: Use GPU acceleration for better performance
                document.getElementById('words-wrapper').style.transform = `translate3d(0, -${state.lineOffset}px, 0)`;
            }
        }

        // --- UI Updaters ---
        function updateFocusUI() {
            const overlay = document.getElementById('focus-overlay');
            // FIX #2: Correct focus overlay visibility logic
            overlay.style.opacity = (state.status === 'idle') ? '1' : '0';
            overlay.style.pointerEvents = (state.status === 'idle') ? 'auto' : 'none';
            document.getElementById('live-stats').style.opacity = state.status !== 'idle' ? '1' : '0';
            updateSingleWord(state.activeWordIndex);
            
            const warning = document.getElementById('capslock-warning');
            warning.style.display = (state.capsLock && state.isFocused && state.status !== 'finished') ? 'flex' : 'none';
        }

        function updateLiveStatsUI() {
            document.getElementById('time-left').innerText = state.timeLeft + 's';
            const maxWpm = 120;
            const clamped = Math.min(state.liveWpm, maxWpm);
            const circ = Math.PI * 35;
            const offset = circ * (1 - clamped / maxWpm);
            document.getElementById('speed-path').style.strokeDasharray = circ;
            document.getElementById('speed-path').style.strokeDashoffset = offset;
            document.getElementById('speed-text').innerText = state.liveWpm;

            document.getElementById('combo-text').innerText = state.combo;
            const comboDisp = document.getElementById('combo-display');
            const comboIcon = document.getElementById('combo-icon');
            
            if (state.combo > 0) {
                comboDisp.className = "flex items-center gap-2 text-2xl font-bold font-mono transition-all duration-300 text-orange-400 drop-shadow-[0_0_8px_rgba(251,146,60,0.8)]";
                if(state.combo > 15) comboDisp.classList.add('scale-110');
            } else {
                comboDisp.className = "flex items-center gap-2 text-2xl font-bold font-mono transition-all duration-300 theme-text-muted";
            }
            
            comboIcon.className = "w-6 h-6 transition-all duration-300";
            if (state.combo > 15) { comboIcon.classList.remove('w-6','h-6'); comboIcon.classList.add('w-8','h-8'); }
            if (state.combo > 10) comboIcon.classList.add('animate-pulse', 'text-orange-500', 'drop-shadow-[0_0_10px_rgba(249,115,22,0.8)]');
            if (state.combo > 25) { comboIcon.classList.remove('text-orange-500'); comboIcon.classList.add('text-red-500', 'drop-shadow-[0_0_12px_rgba(239,68,68,0.8)]'); }
        }

        function updateMascot() {
            let msg = "Ready, set, type!"; let face = "👾";
            if (state.mascotClicks >= 10) { face = "😵"; msg = "Ouch! Stop poking me!"; }
            else if (state.status === 'finished') { face = state.liveWpm > 100 ? "🔥" : state.liveWpm > 80 ? "😎" : "🎉"; msg = state.liveWpm > 100 ? "Godlike typing!" : state.liveWpm > 80 ? "Legendary speed!" : "Great job!"; }
            else if (state.status === 'running') {
                if (state.combo > 20) { face = "🔥"; msg = "UNSTOPPABLE!"; }
                else if (state.combo > 10) { face = "⚡"; msg = "You're on fire!"; }
                else if (state.combo > 5) { face = "👀"; msg = "Nice streak!"; }
                else { face = "👾"; msg = "Keep it up..."; }
            }
            document.getElementById('mascot-msg').innerText = msg;
            document.getElementById('mascot-face').innerText = face;
            
            const wrapper = document.getElementById('mascot-wrapper');
            wrapper.style.opacity = state.status === 'idle' ? '0.3' : '1';
            
            if(state.mascotClicks >= 10) document.getElementById('mascot-face').classList.add('animate-shake');
            else document.getElementById('mascot-face').classList.remove('animate-shake');
        }

        function renderHeaderButtons() {
            const mContainer = document.getElementById('modes-container');
            mContainer.innerHTML = ['words', 'punctuation', 'numbers', 'hard'].map(m => 
                `<button onclick="initTest(state.duration, '${m}')" class="px-3 py-1 text-sm font-medium rounded-md capitalize transition-all ${state.mode === m ? 'theme-accent-bg text-white' : 'hover:theme-panel-bg opacity-70 hover:opacity-100'}">${m}</button>`
            ).join('');

            const tContainer = document.getElementById('times-container');
            tContainer.innerHTML = [15, 30, 60, 120].map(t => 
                `<button onclick="initTest(${t})" class="px-3 py-1 text-sm font-medium rounded-md transition-all ${state.duration === t ? 'theme-accent-bg text-white' : 'hover:theme-panel-bg opacity-70 hover:opacity-100'}">${t}s</button>`
            ).join('');
        }

        function renderResultsView(stats) {
            const width = 800; const height = 160; const padding = 20;
            const maxWpm = Math.max(...state.timeline.map(d => d.wpm), 50);
            const getX = (i) => padding + (i / (state.timeline.length - 1 || 1)) * (width - padding * 2);
            const getY = (wpm) => height - padding - (wpm / maxWpm) * (height - padding * 2);

            const points = state.timeline.map((d, i) => `${getX(i)},${getY(d.wpm)}`).join(' L ');
            const pathD = `M ${getX(0)},${height} L ${points} L ${getX(state.timeline.length - 1)},${height} Z`;
            
            document.getElementById('bottom-controls').style.display = 'none';
            // FIX #7: Also hide live stats on results view
            document.getElementById('live-stats').style.opacity = '0';

            let html = `
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 md:gap-12 mb-12 w-full max-w-5xl">
                    <div class="flex flex-col items-center">
                        <span class="text-lg font-medium mb-1 flex items-center gap-2 theme-text-muted"><i data-lucide="activity" class="w-5 h-5"></i> WPM</span>
                        <span class="text-6xl md:text-8xl font-bold tracking-tighter drop-shadow-xl theme-accent">${stats.wpm}</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <span class="text-lg font-medium mb-1 flex items-center gap-2 theme-text-muted"><i data-lucide="target" class="w-5 h-5"></i> Acc</span>
                        <span class="text-6xl md:text-8xl font-bold tracking-tighter theme-text-bright">${stats.accuracy}%</span>
                    </div>
                    <div class="flex-col items-center justify-center hidden lg:flex">
                        <span class="text-sm uppercase tracking-wider font-bold mb-2 theme-text-muted">Raw Keys</span>
                        <span class="text-3xl font-bold theme-text-bright">${stats.totalChars}</span>
                    </div>
                    <div class="flex-col items-center justify-center hidden lg:flex">
                        <span class="text-sm uppercase tracking-wider font-bold mb-2 theme-text-muted"><i data-lucide="flame" class="inline w-4 h-4 mr-1"></i>Max Combo</span>
                        <span class="text-3xl font-bold theme-accent">${state.maxCombo}</span>
                    </div>
                </div>

                <div class="w-full max-w-4xl rounded-xl p-6 border relative theme-panel-bg theme-border">
                    <h3 class="text-sm font-medium mb-4 absolute top-4 left-6 uppercase tracking-wider theme-text-muted">WPM Timeline</h3>
                    <svg viewBox="0 0 ${width} ${height}" class="w-full h-full overflow-visible mt-4">
                        <defs>
                            <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="rgb(var(--accent-raw))" stop-opacity="0.2" />
                                <stop offset="100%" stop-color="rgb(var(--accent-raw))" stop-opacity="0" />
                            </linearGradient>
                        </defs>
                        ${[0, 0.5, 1].map(r => `<line x1="${padding}" y1="${padding + (height - padding * 2) * r}" x2="${width - padding}" y2="${padding + (height - padding * 2) * r}" stroke="rgba(150,150,150,0.1)" stroke-width="2" stroke-dasharray="4 4" />`).join('')}
                        <path d="${pathD}" fill="url(#chartGradient)" />
                        <path d="M ${points}" fill="none" stroke="rgb(var(--accent-raw))" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                        ${state.timeline.map((d, i) => `<circle cx="${getX(i)}" cy="${getY(d.wpm)}" r="4" fill="var(--bg-raw)" stroke="rgb(var(--accent-raw))" stroke-width="2" />`).join('')}
                    </svg>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-8 text-sm mt-8 py-4 px-8 rounded-2xl border theme-panel-bg theme-border w-full max-w-4xl">
                    <div class="flex flex-col"><span class="uppercase tracking-wider text-xs font-bold mb-1 theme-text-muted">Keystrokes</span><span class="text-base font-medium theme-text-bright">${stats.correctChars} <span class="opacity-50">/</span> <span class="theme-error">${stats.incorrectChars}</span></span></div>
                    <div class="flex flex-col"><span class="uppercase tracking-wider text-xs font-bold mb-1 theme-text-muted">Backspaces</span><span class="text-base font-medium theme-text-bright">${state.backspaceCount}</span></div>
                    <div class="flex flex-col"><span class="uppercase tracking-wider text-xs font-bold mb-1 theme-text-muted">Test Type</span><span class="text-base font-medium capitalize theme-text-bright">${state.duration}s ${state.mode}</span></div>
                    <div class="flex flex-col"><span class="uppercase tracking-wider text-xs font-bold mb-1 theme-text-muted flex items-center gap-1"><i data-lucide="trophy" class="w-3 h-3"></i> PB</span><span class="text-base font-medium theme-accent">${state.personalBest} wpm</span></div>
                </div>
            `;
            document.getElementById('view-results').innerHTML = html;
            lucide.createIcons();
        }

        function renderAchievements() {
            let html = `
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-3">
                    <i data-lucide="award" class="w-8 h-8 theme-accent"></i>
                    <h2 class="text-3xl font-bold theme-text-bright">Achievements</h2>
                </div>
                <div class="font-mono font-bold theme-text-muted">${state.unlockedAchievements.length} / ${ALL_ACHIEVEMENTS.length}</div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4 pb-20">`;
            
            ALL_ACHIEVEMENTS.forEach(ach => {
                const isUnlocked = state.unlockedAchievements.includes(ach.id);
                html += `
                <div class="p-4 rounded-xl border theme-panel-bg ${isUnlocked ? 'theme-border' : 'border-dashed opacity-50 border-gray-600'} transition-all">
                    <div class="flex items-start gap-3">
                        <div class="text-2xl ${isUnlocked ? '' : 'grayscale opacity-30'}">${isUnlocked ? ach.icon : '🔒'}</div>
                        <div>
                            <h3 class="font-bold ${isUnlocked ? 'theme-text-bright' : 'theme-text-muted'}">${isUnlocked || !ach.hidden ? ach.title : 'Secret Achievement'}</h3>
                            <p class="text-sm mt-1 theme-text-muted">${isUnlocked || !ach.hidden ? ach.desc : 'Keep playing to discover this!'}</p>
                        </div>
                    </div>
                </div>`;
            });
            html += `</div>`;
            document.getElementById('view-achievements').innerHTML = html;
            lucide.createIcons();
        }

        // --- Event Listeners ---
        const inputEl = document.getElementById('type-input');
        inputEl.addEventListener('input', handleInput);
        inputEl.addEventListener('keydown', handleKeyDown);
        inputEl.addEventListener('focus', () => { state.isFocused = true; updateFocusUI(); });
        inputEl.addEventListener('blur', () => { state.isFocused = false; updateFocusUI(); });

        window.addEventListener('keydown', (e) => { state.capsLock = e.getModifierState('CapsLock'); updateFocusUI(); });
        window.addEventListener('keyup', (e) => { state.capsLock = e.getModifierState('CapsLock'); updateFocusUI(); });

        document.getElementById('retro-toggle').addEventListener('click', () => {
            state.isRetro = !state.isRetro;
            if(state.isRetro) unlockAchievement('Back to the 80s 📼');
            applyTheme();
        });

        document.getElementById('btn-sound').addEventListener('click', () => {
            state.soundEnabled = !state.soundEnabled;
            document.getElementById('btn-sound').classList.toggle('theme-accent', state.soundEnabled);
            document.getElementById('icon-sound').setAttribute('data-lucide', state.soundEnabled ? 'volume-2' : 'volume-x');
            lucide.createIcons();
        });

        document.getElementById('btn-theme').addEventListener('click', () => {
            if(state.isRetro) return;
            state.themeName = state.themeName === 'dark' ? 'light' : state.themeName === 'light' ? 'matrix' : state.themeName === 'matrix' ? 'arcade' : 'dark';
            // FIX #6: Save theme preference to localStorage
            localStorage.setItem('ultimate_type_theme', state.themeName);
            applyTheme();
        });

        document.getElementById('btn-achievements').addEventListener('click', () => setView(state.currentView === 'test' ? 'achievements' : 'test'));

        document.getElementById('logo-btn').addEventListener('click', () => {
            setView('test'); initTest();
            state.logoClicks++;
            if (state.logoClicks >= 5) {
                document.getElementById('logo-btn').classList.add('rotate-[360deg]', 'scale-110');
                setTimeout(() => {
                    document.getElementById('logo-btn').classList.remove('rotate-[360deg]', 'scale-110');
                    state.logoClicks = 0;
                }, 1000);
            }
        });

        document.getElementById('mascot-face').addEventListener('click', () => {
            if (state.soundEnabled) playSound('mascot');
            state.mascotClicks++;
            if (state.mascotClicks === 10) unlockAchievement('Stop Poking Me 😵');
            updateMascot();
        });

        // Initialize App
        window.onload = () => {
            lucide.createIcons();
            applyTheme();
            initTest();
        };
    </script>
</body>
</html>
